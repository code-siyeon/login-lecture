<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/home/login.css">
    <script src="/js/home/register.js" defer></script>
</head>

<body>
    <div class="login-box">
        <h2>Register</h2>
        <form class="login-form">
            <div class="user-box">
                <input id="name" type="text" name="name" required autocomplete="name"> <!-- 이름 필드 -->
                <label for="name">이름</label>
            </div>
            <div class="user-box">
                <input id="id" type="text" name="id" required autocomplete="username"> <!-- 아이디 필드 -->
                <label for="id">아이디</label>
            </div>
            <div class="user-box">
                <input id="psword" type="password" name="password" required autocomplete="new-password">
                <!-- 비밀번호 필드 -->
                <label for="psword">비밀번호</label>
            </div>
            <div class="user-box">
                <input id="confirm-psword" type="password" name="confirm-password" required autocomplete="new-password">
                <!-- 비밀번호 확인 필드 -->
                <label for="confirm-psword">비밀번호 확인</label>
            </div>
            <div class="user-box">
                <p id="button">회원가입</p>
                <p class="message"><a href="/login"> Already registered? </a></p>
            </div>
        </form>
    </div>
</body>

</html>
